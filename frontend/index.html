<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinanceSupport — AI-Powered Personal Financial Decision Support System" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Finance Support — AI-Powered Financial Decision Support</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("theme");
          var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = (saved === "light" || saved === "dark") ? saved : (prefersLight ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
