# ==================================================
# Docker Compose — Development Environment
# ==================================================
# Only PostgreSQL is containerised.
# Frontend and backend run locally for faster iteration.
# ==================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_support_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findev} -d ${POSTGRES_DB:-finance_support}"]
      interval: 5s
      timeout: 3s
      retries: 5
